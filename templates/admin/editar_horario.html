{% extends "base.html" %}

{% block title %}
Editar Horario
{% endblock %}

{% block content %}

<h1>Editar Horario</h1>

<form method="POST">
    <div class="mb-3">
        <label class="form-label">Día</label>
        <select
            name="dia"
            class="form-select">
            <option
                value="Lunes"
                {% if horario.dia == "Lunes" %}selected{% endif %}>
                Lunes
            </option>
            <option
                value="Martes"
                {% if horario.dia == "Martes" %}selected{% endif %}>
                Martes
            </option>
            <option
                value="Miércoles"
                {% if horario.dia == "Miércoles" %}selected{% endif %}>
                Miércoles
            </option>
            <option
                value="Jueves"
                {% if horario.dia == "Jueves" %}selected{% endif %}>
                Jueves
            </option>
            <option
                value="Viernes"
                {% if horario.dia == "Viernes" %}selected{% endif %}>
                Viernes
            </option>
        </select>
    </div>

    <div class="mb-3">
        <label class="form-label">
            Hora Inicio
        </label>
        <input
            type="time"
            name="hora_inicio"
            class="form-control"
            value="{{ horario.hora_inicio }}">
    </div>

    <div class="mb-3">
        <label class="form-label">
            Hora Fin
        </label>
        <input
            type="time"
            name="hora_fin"
            class="form-control"
            value="{{ horario.hora_fin }}">
    </div>

    <div class="mb-3">
        <label class="form-label">
            Profesor
        </label>
        <select
            name="profesor_id"
            class="form-control">
            {% for profesor in profesores %}
            <option
                value="{{ profesor.id }}"
                {% if profesor.id == horario.profesor_id %}selected{% endif %}>
                {{ profesor.nombre }}
            </option>
            {% endfor %}
        </select>
    </div>
    <button
        type="submit"
        class="btn btn-primary">
        Guardar Cambios
    </button>
</form>
{% endblock %}
