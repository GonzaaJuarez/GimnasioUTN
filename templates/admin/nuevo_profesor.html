{% extends "base.html" %}

{% block title %}
Nuevo Profesor
{% endblock %}

{% block content %}

<h1>Nuevo Profesor</h1>

<form method="POST">

    <div class="mb-3">
        <label class="form-label">Nombre</label>
        <input type="text"
               name="nombre"
               class="form-control"
               required>
    </div>

    <div class="mb-3">
        <label class="form-label">Teléfono</label>
        <input type="text"
               name="telefono"
               class="form-control">
    </div>

    <button type="submit"
            class="btn btn-success">
        Guardar
    </button>

</form>

{% endblock %}
