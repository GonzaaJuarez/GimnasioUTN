{% extends "base.html" %}

{% block title %}
Nuevo Profesor
{% endblock %}

{% block content %}

<h1>Nuevo Profesor</h1>

<form method="POST" enctype="multipart/form-data">

    <div class="mb-3">
        <label class="form-label">Nombre</label>
        <input type="text"
               name="nombre"
               class="form-control"
               required>
    </div>

    <div class="mb-3">
        <label class="form-label">Teléfono</label>
        <input type="text"
               name="telefono"
               class="form-control">
    </div>

    <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email"
            name="email"
            class="form-control">
    </div>

    <div class="mb-3">
        <label class="form-label">Instagram</label>
        <input type="text"
            name="instagram"
            class="form-control">
    </div>

    <div class="mb-3">
        <label class="form-label">Descripción</label>
        <textarea name="descripcion"
                class="form-control"
                rows="4"></textarea>
    </div>

    <div class="mb-3">
        <label class="form-label">Foto</label>
        <input type="file"
            name="foto"
            class="form-control">
    </div>

    <button type="submit"
            class="btn btn-success">
        Guardar
    </button>

</form>

{% endblock %}
