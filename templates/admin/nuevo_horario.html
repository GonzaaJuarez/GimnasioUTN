{% extends "base.html" %}

{% block title %}
Nuevo Horario
{% endblock %}

{% block content %}

<h1>Nuevo Horario</h1>

<form method="POST">
    <div class="mb-3">
        <label class="form-label">Día</label>
        <select name="dia" class="form-select">
            <option>Lunes</option>
            <option>Martes</option>
            <option>Miércoles</option>
            <option>Jueves</option>
            <option>Viernes</option>
        </select>
    </div>
    <div class="mb-3">
        <label class="form-label">Hora Inicio</label>
        <input type="time"
               name="hora_inicio"
               class="form-control"
               step="1800">
    </div>
    <div class="mb-3">
        <label class="form-label">Hora Fin</label>
        <input type="time"
               name="hora_fin"
               class="form-control"
               step="1800">
    </div>
    <div class="mb-3">
        <label class="form-label">Profesor</label>
        <select name="profesor_id"
                class="form-control">
            {% for profesor in profesores %}
            <option value="{{ profesor.id }}">
                {{ profesor.nombre }}
            </option>
            {% endfor %}
        </select>
    </div>
    <div class="mt-3">
        <button
            type="submit"
            class="btn btn-success">
            Guardar
        </button>
        <a
            href="/admin/horarios"
            class="btn btn-secondary">
            Volver
        </a>
    </div>
</form>

{% endblock %}
