{% extends "base.html" %}

{% block title %}
Administrar Profesores
{% endblock %}

{% block content %}

<h1>Administrar Profesores</h1>

<a href="/admin/profesores/nuevo"
   class="btn btn-success mb-3">
    Nuevo Profesor
</a>
<form method="GET" class="mb-3">
    <label class="form-label">
        Ordenar por:
    </label>
    <select
        name="orden"
        class="form-select w-auto"
        onchange="this.form.submit()">
        <option
            value="az"
            {% if orden == "az" %}selected{% endif %}>
            Nombre A-Z
        </option>
        <option
            value="za"
            {% if orden == "za" %}selected{% endif %}>
            Nombre Z-A
        </option>
        <option
            value="nuevos"
            {% if orden == "nuevos" %}selected{% endif %}>
            Más recientes
        </option>
        <option
            value="viejos"
            {% if orden == "viejos" %}selected{% endif %}>
            Más antiguos
        </option>
    </select>
</form>

<div class="list-group">
    {% for profesor in profesores %}
        <div class="list-group-item d-flex justify-content-between align-items-center">
            <span>{{ profesor.nombre }}</span>
            <div>
                <a href="/admin/profesores/editar/{{ profesor.id }}"
                class="btn btn-warning btn-sm">
                    Editar
                </a>
                <a
                    href="/admin/profesores/eliminar/{{ profesor.id }}"
                    class="btn btn-danger btn-sm"
                    onclick="return confirm('¿Está seguro de que desea eliminar a {{ profesor.nombre }}?')">
                    Eliminar
                </a>
            </div>
        </div>
    {% endfor %}
</div>

{% endblock %}
