{% extends "base.html" %}

{% block title %}
Profesores
{% endblock %}

{% block content %}

<h1>Profesores</h1>
<div class="list-group">
    {% for profesor in profesores %}

        <a href="/profesores/{{ profesor.id }}"
        class="list-group-item list-group-item-action">
            {{ profesor.nombre }}
        </a>

    {% endfor %}
</div>
{% endblock %}
